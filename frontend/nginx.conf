# Sirve el build estático de la SPA (React Router en modo history/browser):
# cualquier ruta que no coincida con un archivo real cae en index.html, para
# que rutas como /shop/producto-x o /admin/pedidos funcionen al recargar la
# página o entrar por URL directa, en vez de dar 404 de Nginx.
#
# El sitemap dinámico y robots.txt reales los sirve el backend
# (GET /sitemap.xml, frontend/public/robots.txt se copia tal cual al build
# — ver docs/03-api.md, sección Fase 16). Este archivo solo sirve estáticos.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionados por Vite (hash en el nombre de archivo) — caché
    # larga y segura: un cambio de contenido siempre implica un nombre de
    # archivo nuevo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
